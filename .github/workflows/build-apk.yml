name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew assembleDebug --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            # make the error readable without log access: show it as a check annotation
            msg=$(grep -v "^\s*at " build.log | tail -n 40 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle build failed::$msg"
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: awareen-sync-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Rolling release "latest": a stable public download link for the newest APK
      # https://github.com/${{ github.repository }}/releases/download/latest/app-debug.apk
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk \
            --title "Latest build" --notes "Automatic build of commit ${GITHUB_SHA::7}" --prerelease --target "$GITHUB_SHA"
